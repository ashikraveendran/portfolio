<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Terminal</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="window-controls" aria-label="window controls">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <div class="titlebar-center" aria-label="Project search">
          <div class="titlebar-search" role="searchbox" aria-label="ashik-dev search box">
            <input type="text" value="ashik-dev" readonly aria-label="ashik-dev" />
            <span class="search-icon" aria-hidden="true">⌕</span>
          </div>
        </div>

        <div class="topbar-actions">
          <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">☾</span>
            <span class="theme-label">Dark</span>
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="sidebar-icons">
            <button class="nav-icon active" aria-label="Explorer">⌂</button>
            <button class="nav-icon" aria-label="Source Control">⎇</button>
            <button class="nav-icon" aria-label="Search">⌕</button>
            <button class="nav-icon" aria-label="Extensions">◫</button>
            <button class="nav-icon" aria-label="Run">▶</button>
          </div>

        </aside>

        <aside class="explorer-panel">
          <div class="panel-header">EXPLORER</div>
          <ul id="fileList" class="file-list" aria-label="project files"></ul>
        </aside>

        <main class="content-panel">
          <div class="tab-strip" id="tabStrip">
            <button class="tab active" data-tab="about">about.md</button>
            <button class="tab" data-tab="education">education.md</button>
            <button class="tab" data-tab="experience">experience.md</button>
            <button class="tab" data-tab="projects">projects.md</button>
            <button class="tab" data-tab="skills">skills.md</button>
          </div>

          <section class="editor-view">
            <div class="code-header">
            </div>

            <div class="code-block" id="codeBlock"></div>
          </section>
        </main>

        <aside class="terminal-panel">
          <div class="terminal-header">
            <span>TERMINAL</span>
            <span class="terminal-badge">chatbot</span>
          </div>

          <div class="terminal-output" id="terminalOutput" aria-live="polite"></div>
        </aside>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="chatbot.js"></script>
  </body>
</html>
